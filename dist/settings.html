<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory - Settings</title>
  <script type="module" crossorigin src="./assets/main-DJQ-_5Ph.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/main-BvxE8wy3.css">
  <link rel="stylesheet" crossorigin href="./assets/settings-azc2zfrf.css">
</head>
<body>
    <div class="settingsHeading">
        <h1>Settings</h1>
    </div>
    <div id="settingsContainer">
        <div id="gameSettings">
        <div id="themeSettings">
            <p><img src="./assets/palette.svg" alt="Palette icon" /> Game themes</p>
            <ul>
                <li><label><input type="radio" name="theme" value="codeVibes" /> Code vibes theme <img src="./assets/setting_line.svg" alt="Setting line icon" /></label></li>
                <li><label><input type="radio" name="theme" value="gaming" /> Gaming theme <img src="./assets/setting_line.svg" alt="Setting line icon" /></label></li>
                <li><label><input type="radio" name="theme" value="daProjects" /> DA projects theme <img src="./assets/setting_line.svg" alt="Setting line icon" /></label></li>
                <li><label><input type="radio" name="theme" value="foods" /> Foods theme <img src="./assets/setting_line.svg" alt="Setting line icon" /></label></li>
            </ul>
        </div>
        <div id="playerSettings">
            <p><img src="./assets/chess_pawn.svg" alt="Chess pawn icon" /> Choose Player</p>
            <ul>
                <li><label><input type="radio" name="player" value="blue" /> Blue <img src="./assets/setting_line.svg" alt="Setting line icon" /></label></li>
                <li><label><input type="radio" name="player" value="orange" /> Orange <img src="./assets/setting_line.svg" alt="Setting line icon" /></label></li>
            </ul>
        </div>
        <div id="boardSizeSettings">
            <p><img src="./assets/style.svg" alt="Style icon" /> Board Size</p>
            <ul>
                <li><label><input type="radio" name="boardSize" value="16" /> 16 Cards <img src="./assets/setting_line.svg" alt="Setting line icon" /></label></li>
                <li><label><input type="radio" name="boardSize" value="24" /> 24 Cards <img src="./assets/setting_line.svg" alt="Setting line icon" /></label></li>
                <li><label><input type="radio" name="boardSize" value="36" /> 36 Cards <img src="./assets/setting_line.svg" alt="Setting line icon" /></label></li>
            </ul>
        </div>
        </div>
        <div id="preview_gameBar">
        <div id="themePreview">
            <img src="./assets/theme_preview/gameing.svg" alt="Theme preview" />
        </div>
        <div id="gameBar">
                <p id="game_theme">Game Theme</p>
                <hr id="gameBar_line" />
                <p id="player">Player</p>
                <hr id="gameBar_line" />
                <p id="board_size">Board Size</p>
                <button id="playButton" aria-label="Start Game"><a href="game.html">Start Game</a></button>
        </div>
        </div>
    </div>


</body>
</html>
