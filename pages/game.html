<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory - Game</title>
</head>
<body>
    <header id="gameHeader">
        <div id="scoreBoard">
            <div class="scoreBoardEntry scoreBoardEntry--blue">
                <span class="scoreBoardLabel scoreBoardLabel--blue" aria-hidden="true"></span>
               
                <p id="blueScoreValue" class="scoreBoardValue">0</p>
            </div>

            <div class="scoreBoardEntry scoreBoardEntry--orange">
                <span class="scoreBoardLabel scoreBoardLabel--orange" aria-hidden="true"></span>
                
                <p id="orangeScoreValue" class="scoreBoardValue">0</p>
            </div>
        </div>
        <div id="currentPlayer">
            <p id="current-player-label">Current player:</p>
            <div id="currentPlayerTag"><img src="../assets/ui/current_player_tag.svg" alt="Current Player" /></div>
        </div>
        <div id="exit">
            <a href="settings.html" aria-label="Exit Game">
                <span class="exitIcon" aria-hidden="true"></span>
                <span>Exit Game</span>
            </a>
        </div>
    </header>
    <section id="field">
       
    </section>

    <script type="module" src="/src/game.ts"></script>
</body>
</html>
